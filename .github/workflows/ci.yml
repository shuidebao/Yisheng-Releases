name: Validate source

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches VERSION
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath "APP/Yisheng/VERSION" -Raw).Trim()
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match VERSION $version"
          }

      - name: Run source tests
        shell: pwsh
        working-directory: APP/Yisheng
        run: python -m unittest discover -s tests -v
